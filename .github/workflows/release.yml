name: Release

# On a vX.Y.Z tag, build static linux binaries and container images, generate
# SHA256 checksums, and publish all deployment support assets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # required to create/update the release and upload assets
  packages: write # required to publish the application and Bot API images

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Test gate (never publish binaries from a broken commit — CI's Go checks)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
          go vet ./...
          scripts/lint.sh
          python3 scripts/check-test-chat-ids.py internal cmd testdata
          python3 scripts/check-vendored.py
          python3 scripts/check-locale-catalogues.py
          python3 scripts/check-inherited-commands.py
          python3 scripts/check-one-clock.py
          python3 scripts/check-one-transport.py
          python3 scripts/check-links-resolve.py
          python3 scripts/check-log-privacy.py
          python3 scripts/check-mutations-authorise.py
          python3 scripts/check-whole-table-writes.py
          python3 scripts/check-migration-declarations.py migrations
          python3 scripts/check-schema-manifest.py deploy/vestibule-schema-manifest
          python3 scripts/check-console-routes.py
          python3 scripts/check-phase-acceptance.py
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go build ./...
          go build -tags gentoo ./...
          go test -race ./...
          go test -race -tags gentoo ./...
          scripts/test-static-sqlite.sh
          scripts/test-install.sh
          scripts/test-replacement.sh
          scripts/accept-phase9.sh
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude=G304,G703,G706 ./...
      - name: Build static linux binaries (amd64 + arm64)
        run: |
          set -euo pipefail
          mkdir -p dist
          ver="${GITHUB_REF_NAME}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${ver}" \
              -o "dist/vestibule-linux-${arch}" ./cmd/bot
          done
          go run ./cmd/schema-manifest -output dist/vestibule-schema-manifest
          cp deploy/vestibule.service dist/vestibule.service
          cp deploy/install.sh dist/vestibule-install
          cp deploy/install-common.sh dist/vestibule-install-common
          cp deploy/install-native.sh dist/vestibule-install-native
          cp deploy/install-container.sh dist/vestibule-install-container
          cp deploy/vestibule-replace dist/vestibule-replace
          cp deploy/vestibule-replace.service dist/vestibule-replace.service
          cp deploy/vestibule-replace.path dist/vestibule-replace.path
          cp deploy/compose.yaml dist/compose.yaml
          (
            cd dist
            sha256sum vestibule-linux-amd64 vestibule-linux-arm64 vestibule-schema-manifest \
              vestibule.service vestibule-install vestibule-install-common vestibule-install-native \
              vestibule-install-container vestibule-replace vestibule-replace.service \
              vestibule-replace.path compose.yaml > SHA256SUMS
          )
          ls -l dist
      - name: Publish credential-free container images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          app_image="ghcr.io/${owner}/vestibule:${GITHUB_REF_NAME}"
          bot_api_image="ghcr.io/${owner}/vestibule-bot-api:${GITHUB_REF_NAME}"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --pull --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${GITHUB_REF_NAME}" --tag "$app_image" --push -f deploy/Dockerfile .
          docker buildx build --pull --platform linux/amd64,linux/arm64 \
            --tag "$bot_api_image" --push -f deploy/Dockerfile.bot-api .
      - name: Publish release with binaries, deployment assets, and checksums
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/vestibule-linux-amd64
            dist/vestibule-linux-arm64
            dist/vestibule-schema-manifest
            dist/vestibule.service
            dist/vestibule-install
            dist/vestibule-install-common
            dist/vestibule-install-native
            dist/vestibule-install-container
            dist/vestibule-replace
            dist/vestibule-replace.service
            dist/vestibule-replace.path
            dist/compose.yaml
            dist/SHA256SUMS
