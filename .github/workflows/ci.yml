name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline ratchet compares this commit's baseline.txt against the
          # base branch's, so the base commit has to be in the clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: lint
        run: scripts/lint.sh
      - name: A held violation may not grow
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD^' }}"
          python3 scripts/check-baseline-ratchet.py "$base"

      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: build
        run: go build ./...
      - name: build (gentoo edition)
        run: go build -tags gentoo ./...
      - name: test
        run: go test -race ./...
      - name: test (gentoo edition)
        run: go test -race -tags gentoo ./...
      - name: static SQLite release-runtime gate
        run: scripts/test-static-sqlite.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: gosec
        # Triaged-accepted under the private systemd StateDirectory= deployment: G304/G703
        # (operator-controlled config / STATE_DIRECTORY paths) and G706 (log taint on operator /
        # Telegram-supplied values, consumed by journald). The gate fails on any OTHER finding.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude=G304,G703,G706 ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ARCHITECTURE.md is generated, not hand-edited
        run: python3 scripts/gen-arch-md.py --check
      - name: Documents agree with themselves
        run: python3 scripts/check-docs.py
      - name: CONTRIBUTING names every gate CI runs
        run: python3 scripts/check-gate-list.py
      - name: The documented limits are the enforced limits
        run: python3 scripts/check-limits.py
      - name: Nothing a viewer reads is written in a component
        run: python3 scripts/check-console-copy.py
      - name: The privacy statement names every table holding a person
        run: python3 scripts/check-privacy-tables.py
      - name: Chinese prose — docs/PRIVACY.zh-CN.md
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: docs/PRIVACY.zh-CN.md
      # One path per step: the action passes its `path` input as a single quoted
      # argument, so a space-separated list becomes one filename that does not exist.
      #
      # Two documents are deliberately absent. docs/previous-generation/ is 21 documents
      # from the bot being replaced, kept as they were written rather than as prose we
      # author. docs/INVENTORY.md is a lookup table whose categorical cells repeat by
      # design, which the checker reads as a repeated sentence; no style setting accepts
      # it. CONTRIBUTING's rule is prose people follow, and neither is that.
      - name: Chinese prose — docs/PLAN-v5.md
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: docs/PLAN-v5.md
      - name: Chinese prose — docs/ARCHITECTURE.md
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: docs/ARCHITECTURE.md
      - name: Chinese prose — docs/README.md
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: docs/README.md
      - name: Chinese prose — web/design.html
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: web/design.html
      - name: Chinese prose — web/architecture.html
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: web/architecture.html
      - name: Console frontend builds and its stylesheet holds the rules
        run: |
          cd web && npm ci --silent && npm run build
          cd ..
          for c in style-rules undefined-var shadowed theme-leak; do
            python3 "scripts/design-checks/$c.py" web/dist/assets/*.css
          done
          for f in tokens components shell; do
            diff -q "$HOME/design-system/app/$f.css" "web/src/styles/$f.css" \
              || echo "::warning::web/src/styles/$f.css differs from the shared design system"
          done

      - name: Console session-to-release journey and render gate work in Chromium
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Structure, style rules and coverage of the two pages
        run: |
          for c in html-structure style-rules css-coverage shadowed undefined-var theme-leak; do
            python3 "scripts/design-checks/$c.py" web/design.html web/architecture.html
          done
