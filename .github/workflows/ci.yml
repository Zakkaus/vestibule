name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline ratchet compares this commit's baseline.txt against the
          # base branch's, so the base commit has to be in the clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: lint
        run: scripts/lint.sh
      - name: Test chat identifiers stay in the synthetic range
        run: python3 scripts/check-test-chat-ids.py internal cmd testdata
      - name: A held violation may not grow
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD^' }}"
          python3 scripts/check-baseline-ratchet.py "$base"

      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: build
        run: go build ./...
      - name: build (gentoo compatibility tag; behavior must stay identical)
        run: go build -tags gentoo ./...
      - name: test
        run: go test -race ./...
      - name: test (gentoo compatibility tag; behavior must stay identical)
        run: go test -race -tags gentoo ./...
      - name: static SQLite release-runtime gate
        run: scripts/test-static-sqlite.sh
      - name: Native installer lifecycle works without root, network, or systemd
        run: scripts/test-install.sh
      - name: Host replacement unit lifecycle works without root, Docker, or systemd
        run: scripts/test-replacement.sh
      - name: Phase nine acceptance remains explicit about incomplete host paths
        run: scripts/accept-phase9.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: gosec
        # Triaged-accepted under the private systemd StateDirectory= deployment: G304/G703
        # (operator-controlled config / STATE_DIRECTORY paths) and G706 (log taint on operator /
        # Telegram-supplied values, consumed by journald). The gate fails on any OTHER finding.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude=G304,G703,G706 ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ARCHITECTURE.md is generated, not hand-edited
        run: python3 scripts/gen-arch-md.py --check
      - name: Documents agree with themselves
        run: python3 scripts/check-docs.py
      - name: CONTRIBUTING names every gate CI runs
        run: python3 scripts/check-gate-list.py
      - name: The documented limits are the enforced limits
        run: python3 scripts/check-limits.py
      - name: Nothing a viewer reads is written in a component
        run: python3 scripts/check-console-copy.py
      - name: The privacy statement names every table holding a person
        run: python3 scripts/check-privacy-tables.py
      - name: Migrations state rollback compatibility explicitly
        run: python3 scripts/check-migration-declarations.py migrations
      - name: Released schema manifest matches migration table
        run: python3 scripts/check-schema-manifest.py deploy/vestibule-schema-manifest
      - name: No screen reaches for a later phase's endpoints
        run: python3 scripts/check-phase-seams.py
      - name: Console routes match the exhaustive architecture table
        run: python3 scripts/check-console-routes.py
      - name: Every completed plan phase has executable acceptance coverage
        run: python3 scripts/check-phase-acceptance.py
      - name: Every acceptance exemption rests on a reason that can still be true
        run: python3 scripts/check-acceptance-exemptions.py
      - name: The vendored copies still match the bytes they were copied at
        run: python3 scripts/check-vendored.py
      - name: The three locale catalogues agree with each other and with the code
        run: python3 scripts/check-locale-catalogues.py
      - name: Nothing the previous generation answered has disappeared
        run: python3 scripts/check-inherited-commands.py
      - name: Every declared message field is read outside the catalogue
        run: python3 scripts/check-message-fields-are-read.py
      - name: Verification decides against a clock a test can move
        run: python3 scripts/check-one-clock.py
      - name: Every console request goes through the one transport
        run: python3 scripts/check-one-transport.py
      - name: Every console link points at a route that exists
        run: python3 scripts/check-links-resolve.py
      - name: A screen that writes recognises a stale security token
        run: python3 scripts/check-writing-screens-know-a-stale-token.py
      - name: A screen only maps error codes the API can send
        run: python3 scripts/check-error-maps-hold-real-codes.py
      - name: What a person typed does not reach the log
        run: python3 scripts/check-log-privacy.py
      - name: A handler that changes something authorises first
        run: python3 scripts/check-mutations-authorise.py
      - name: A handler acts on the chat it authorised
        run: python3 scripts/check-handlers-act-on-what-they-authorised.py
      - name: A write that clears a per-group table records its guard
        run: python3 scripts/check-whole-table-writes.py
      - name: Chinese prose — docs/PRIVACY.zh-CN.md
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: docs/PRIVACY.zh-CN.md
      # One path per step: the action passes its `path` input as a single quoted
      # argument, so a space-separated list becomes one filename that does not exist.
      #
      # Two documents are deliberately absent. docs/previous-generation/ is 21 documents
      # from the bot being replaced, kept as they were written rather than as prose we
      # author. docs/INVENTORY.md is a lookup table whose categorical cells repeat by
      # design, which the checker reads as a repeated sentence; no style setting accepts
      # it. CONTRIBUTING's rule is prose people follow, and neither is that.
      - name: Chinese prose — docs/PLAN-v5.md
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: docs/PLAN-v5.md
      - name: Chinese prose — docs/ARCHITECTURE.md
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: docs/ARCHITECTURE.md
      - name: Chinese prose — docs/README.md
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: docs/README.md
      - name: Chinese prose — web/design.html
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: web/design.html
      - name: Chinese prose — web/architecture.html
        uses: Zakk-LLM/Chinese-skill@242ec69c089f5dae91cfc7eb3b4dc924d5c1aab0 # v1.4.0
        with:
          path: web/architecture.html
      - name: Console frontend builds and its stylesheet holds the rules
        run: |
          cd web && npm ci --silent && npm run build
          cd ..
          for c in coverage-floor style-rules undefined-var shadowed theme-leak comment-boundaries percentage-min; do
            python3 "scripts/design-checks/$c.py" web/dist/assets/*.css
          done
          for c in coverage-floor comment-boundaries padding-ratio peer-consistency percentage-min shorthand-across-layers; do
            python3 "scripts/design-checks/$c.py" web/src/styles/tokens.css web/src/styles/components.css web/src/styles/shell.css web/src/app/app.css
          done
          for f in tokens components shell; do
            diff -q "$HOME/design-system/app/$f.css" "web/src/styles/$f.css" \
              || echo "::warning::web/src/styles/$f.css differs from the shared design system"
          done

      - name: Console session-to-release journey and render gate work in Chromium
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Structure, style rules and coverage of the two pages
        run: |
          for c in html-structure coverage-floor style-rules css-coverage shadowed undefined-var theme-leak comment-boundaries percentage-min; do
            python3 "scripts/design-checks/$c.py" web/design.html web/architecture.html
          done
