name: Exhaustive locale render gate

on:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read

jobs:
  render-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: cd web && npm ci --silent
      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Render every locale, route, width, and theme
        env:
          PLAYWRIGHT_PORT_OFFSET: 210
          RENDER_GATE_LOCALES: all
        run: cd web && npm run e2e -- e2e/render-gate.spec.ts
