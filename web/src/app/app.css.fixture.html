<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title></title>
  </head>
  <body>
    <div data-slot="card"></div>
    <span data-slot="badge"></span>
    <div data-shell-variant="entry"></div>
    <div data-prerequisite-state="missing"></div>
    <span data-status="ok"></span>
    <span data-status="info"></span>
    <span data-status="pending"></span>
    <span data-status="error"></span>
    <span data-status="neutral"></span>
    <div data-capability-outcome="disabled"></div>
    <div data-slot="button"></div>
    <div data-slot="field-error"></div>
    <div data-slot="input"></div>
    <div data-slot="select"></div>
    <div data-slot="setting" data-diagnostics-daily-setting>
      <div data-setting-control><div data-slot="select"></div></div>
    </div>
    <div data-slot="textarea"></div>
    <div data-stats-chart-series="pass-rate"></div>
    <div data-tone="error"></div>
    <div data-tone="info"></div>
    <div data-tone="neutral"></div>
    <div data-tone="ok"></div>
    <div data-tone="warning"></div>
    <div data-variant="link"></div>
    <div data-utility-controls data-variant="chrome"><div data-utility-control></div></div>
    <div data-version-action="upgrade"></div>
    <div data-version-replacement-result="failed"></div>
    <div data-version-replacement-result="rejected"></div>
    <div data-version-replacement-result="rollback_failed"></div>
    <div data-version-rollback="available"></div>
    <div data-version-rollback="blocked"></div>
    <div data-version-upgrade-outcome="applied"></div>
    <div data-version-upgrade-outcome="unavailable"></div>
  </body>
</html>
